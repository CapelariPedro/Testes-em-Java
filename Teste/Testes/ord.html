<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Date Range Picker Customizado</title>
  <link rel="stylesheet" href="datepiker_meuspareceres.css" />
</head>

<body>

<div class="modal-filtro">
  <div class="modal-filtro-box">
    <label class="modal label">Grupo de Pareceres</label>
    <div class="select-display-grupo">
      <img class="icon-apagar-grupo">
      <span>Grupo de Pareceres</span>
    </div>

  </div>

  <div class="modal-filtro-data">
    <div class="input-data">
      <div class="input-block">
        <label for="startDate">Data Início</label>
        <input type="text" id="startDate" placeholder="DD-MM-AAAA" readonly />
      </div>
      <span class="date-separator">-</span>
      <div class="input-block">
        <label for="endDate">Data Fim</label>
        <input type="text" id="endDate" placeholder="DD-MM-AAAA" readonly />
      </div>
    </div>
    <div class="calendar-container" id="calendar" style="display:none;">
      <div class="header">
        <div id="header-text"></div>
        <button class="nav-btn" id="prev">&#8249;</button>
        <button class="nav-btn" id="next">&#8250;</button>
      </div>

      <div id="calendar-content"></div>
    </div>

    <div>
      <button id="clear-btn">Limpar</button>
    </div>

  </div>
</div>

  <script src="datepiker_meuspareceres.js"></script>

</body>

</html>
